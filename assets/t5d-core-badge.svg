<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>T5D Core</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="35%" stop-color="#7d8794"/>
      <stop offset="70%" stop-color="#202833"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67d7ff"/>
      <stop offset="100%" stop-color="#005bff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6767"/>
      <stop offset="100%" stop-color="#c40000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <polygon points="512,80 880,348 738,780 286,780 144,348" fill="#07111f" stroke="url(#metal)" stroke-width="32"/>
  <polygon points="512,120 830,360 710,728 314,728 194,360" fill="none" stroke="url(#blue)" stroke-width="10" filter="url(#glow)"/>
  <g fill="none" stroke="#1a8cff" stroke-width="5" opacity=".7">
    <path d="M260 380 H375 M650 380 H765 M350 645 H500 M520 645 H675"/>
    <circle cx="375" cy="380" r="10" fill="#2ec7ff"/><circle cx="650" cy="380" r="10" fill="#2ec7ff"/>
  </g>
  
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="330" y="575" font-size="210" fill="url(#blue)" stroke="#d8e8ff" stroke-width="4">T</text>
    <text x="512" y="575" font-size="230" fill="url(#red)" stroke="#ffd4d4" stroke-width="4">5</text>
    <text x="705" y="575" font-size="210" fill="url(#blue)" stroke="#d8e8ff" stroke-width="4">D</text>
  </g>
  
  <text x="512.0" y="944" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800" letter-spacing="8" fill="#e8eef8">T5D CORE</text>
</svg>